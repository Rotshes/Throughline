# Local development. Without this, netlify dev tries to auto-detect the
# framework and can end up running the production build instead of a dev server.
# framework = "#custom" turns detection off and uses exactly what is stated here.
[dev]
  command    = "npm run dev"
  targetPort = 5173
  framework  = "#custom"
  publish    = "web/dist"
  autoLaunch = false

[build]
  command  = "npm run build"
  publish  = "web/dist"
  functions = "netlify/functions"

# The pipeline reads its prompt, schema and the three pinned vocabularies from
# disk at request time. Without these the bundled function would deploy cleanly
# and then fail on the first request. See src/paths.js — and note that
# data/categories.json, platforms.json, tags.json and angles.json are all
# required, not optional.
[functions]
  node_bundler = "esbuild"
  included_files = ["prompts/**", "schemas/**", "data/**"]
  # data/** covers categories, platforms, tags, angles and statuses. All five are
  # required at request time; none is optional.

[[redirects]]
  from = "/api/home"
  to   = "/.netlify/functions/home"
  status = 200

[[redirects]]
  from = "/api/game"
  to   = "/.netlify/functions/game"
  status = 200

[[redirects]]
  from = "/api/library"
  to   = "/.netlify/functions/library"
  status = 200

[[redirects]]
  from = "/api/shortlist/click"
  to   = "/.netlify/functions/shortlist/click"
  status = 200

[[redirects]]
  from = "/api/shortlist"
  to   = "/.netlify/functions/shortlist"
  status = 200

# Single-page app: everything else serves the built index.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
